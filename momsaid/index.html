<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>엄마가 뭐랬어</title><style>:root{--ink:#2B2220;--sub:#7A6A66;--faint:#B3A6A2;--line:#F1E2DA;--page:#FFF6EE;--card:#FFFFFF;--accent:#C8423F;--soft:#FDE3DF}
@media (prefers-color-scheme: dark){:root{--ink:#F3EAE6;--sub:#C4B5B0;--faint:#8A7D79;--line:#3A2E2B;--page:#1C1615;--card:#261E1C;--accent:#FF8A6B;--soft:#3A2522}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.75}
main{max-width:720px;margin:0 auto;padding:28px 16px 56px}
.brand{margin-bottom:18px}.brand a{color:var(--accent);font-weight:800;font-size:14px;text-decoration:none}
h1{font-size:24px;line-height:1.35;margin:0 0 6px}.meta{color:var(--sub);font-size:12.5px;margin:0 0 22px}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
h2{font-size:15.5px;margin:0 0 6px}p,li{margin:6px 0;font-size:14.5px}ul{padding-left:20px;margin:6px 0}
nav.links{display:grid;gap:10px;margin-top:6px}nav.links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px;color:var(--ink);text-decoration:none;font-weight:700}
nav.links a span{display:block;color:var(--sub);font-weight:500;font-size:12.5px;margin-top:2px}
footer{color:var(--faint);font-size:12px;margin-top:28px}a{color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.langs{display:flex;gap:6px}.langs button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}.langs button[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:transparent}[lang-block][hidden]{display:none}</style></head>
<body><main data-title-ko="엄마가 뭐랬어" data-title-ja="小言カレンダー"><div class="top"><div class="brand" style="margin:0"><a href="./"><span lang-block="ko">엄마가 뭐랬어</span><span lang-block="ja" hidden>小言カレンダー</span></a></div><div class="langs"><button type="button" data-lang="ko" aria-pressed="true">한국어</button><button type="button" data-lang="ja" aria-pressed="false">日本語</button></div></div>
<div lang-block="ko" lang="ko"><h1>엄마가 뭐랬어</h1><p class="meta">엄마처럼 잔소리해 주는 캘린더 앱이에요.</p>
<nav class="links"><a href="privacy/">개인정보처리방침<span>어떤 정보를 어떻게 다루는지</span></a><a href="support/">고객 지원<span>문의 방법과 자주 묻는 질문</span></a></nav></div><div lang-block="ja" lang="ja" hidden><h1>小言カレンダー</h1><p class="meta">お母さんみたいに小言を言ってくれるカレンダーアプリです。</p>
<nav class="links"><a href="privacy/?lang=ja">プライバシーポリシー<span>どんな情報をどう扱うか</span></a><a href="support/?lang=ja">サポート<span>お問い合わせ方法とよくある質問</span></a></nav></div>
<footer>© 2026 Minjae Jeon · <a href="mailto:wmj5169@naver.com">wmj5169@naver.com</a></footer>
</main><script>(function(){var q=new URLSearchParams(location.search).get('lang');var nav=(navigator.language||'').toLowerCase();var lang=q==='ja'||q==='ko'?q:(nav.indexOf('ja')===0?'ja':'ko');
function show(l){document.documentElement.lang=l;document.querySelectorAll('[lang-block]').forEach(function(e){e.hidden=e.getAttribute('lang-block')!==l});document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l?'true':'false')});var t=document.querySelector('[data-title-'+l+']');if(t)document.title=t.getAttribute('data-title-'+l);}
document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.lang);var u=new URL(location.href);u.searchParams.set('lang',b.dataset.lang);history.replaceState(null,'',u)})});show(lang);})();</script></body></html>
